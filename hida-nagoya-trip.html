<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>飛驒・美濃・名古屋｜秋日紀行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;600;700&family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
:root{
  --deep:#0d3348;
  --deep-2:#082530;
  --cream:#efece4;
  --paper:rgba(255,253,248,.92);
  --paper-solid:#fffdf8;
  --paper-2:#f7f3ea;
  --gold:#93822d;
  --gold-l:#c2ab5f;
  --clay:#b1552f;
  --ink:#22292c;
  --mut:#8a8578;
  --line:rgba(13,51,72,0.12);
  --shadow:0 10px 30px rgba(13,51,72,0.10);
  --shadow-lg:0 24px 60px rgba(8,37,48,0.28);
  --nav-h:64px;
  --serif:'Zen Old Mincho','Shippori Mincho',serif;
  --sans:'Noto Sans TC',sans-serif;
  --lat:'Playfair Display',serif;
  --glass:rgba(255,253,248,.86);
  --glass-b:rgba(255,255,255,.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 12% -6%, rgba(147,130,45,.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(13,51,72,.08), transparent 55%),
    var(--cream);
  color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
}
.glass{
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--glass-b);
}
.wm-ic{position:absolute;right:-6px;bottom:-8px;opacity:.10;pointer-events:none;transform:rotate(10deg);color:var(--deep);}
.wm-ic svg{display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;}
::selection{background:var(--gold);color:#fff;}

/* ---------- APP SHELL ---------- */
#app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;}
#scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 20px calc(var(--nav-h) + 34px);
}

/* ---------- TOP BAR ---------- */
.topbar{
  position:absolute;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:14px 18px 10px;pointer-events:none;
}
.menu-btn{
  pointer-events:auto;
  width:46px;height:46px;flex:none;border-radius:50%;
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--glass-b);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s;
}
.menu-btn:active{transform:scale(.92);}
.menu-btn span{display:block;width:17px;height:1.6px;background:var(--deep);border-radius:2px;position:relative;}
.menu-btn span::before,.menu-btn span::after{
  content:"";position:absolute;left:0;width:17px;height:1.6px;background:var(--deep);border-radius:2px;
}
.menu-btn span::before{top:-5.5px;}
.menu-btn span::after{top:5.5px;}

.status-pill{
  pointer-events:auto;
  margin-left:auto;display:flex;align-items:center;
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--glass-b);border-radius:36px;box-shadow:var(--shadow);
  padding:7px 7px 7px 16px;gap:14px;
}
.status-pill .loc{font-size:11px;color:var(--mut);letter-spacing:.04em;}
.status-pill .loc b{display:block;font-family:var(--serif);font-size:13px;color:var(--deep);font-weight:600;letter-spacing:0;}
.status-pill .sep{width:1px;height:24px;background:var(--line);}
.status-pill .rng{font-family:var(--lat);font-size:20px;font-weight:600;color:var(--deep);line-height:1;letter-spacing:.02em;}
.status-pill .rng small{font-family:var(--sans);font-size:10px;color:var(--mut);display:block;margin-top:3px;letter-spacing:.06em;}
.dcount{
  background:var(--clay);color:#fff;border-radius:26px;
  padding:8px 12px;text-align:center;line-height:1;
}
.dcount b{font-family:var(--lat);font-size:19px;font-weight:600;letter-spacing:.02em;}
.dcount small{display:block;font-size:8.5px;letter-spacing:.18em;margin-top:2px;opacity:.85;}

/* ---------- HERO ---------- */
.hero{padding:84px 0 6px;}
.hero .greet{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(25px,7vw,32px);line-height:1.42;color:var(--deep);margin:0;
}
.hero .sub{font-size:13px;color:var(--gold);margin:8px 0 0;letter-spacing:.03em;}

/* ---------- MAP ---------- */
.mapcard{
  margin:20px 0 0;border-radius:28px;
  box-shadow:var(--shadow-lg);padding:14px 12px 10px;position:relative;overflow:hidden;
  border:4px solid #fff;
}
.mapcard svg{display:block;width:100%;height:auto;}
.mapcard{background:#ece7db;}
.sea{fill:#cfdee0;}
.land{fill:#e6dfd0;}
.coast{fill:none;stroke:var(--deep);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
.river{fill:none;stroke:#9fbcc2;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
.pref-line{fill:none;stroke:var(--deep);stroke-width:.9;opacity:.4;stroke-dasharray:4 3;}
.pref-lbl{font-family:var(--serif);font-size:13px;fill:var(--deep);opacity:.32;text-anchor:middle;letter-spacing:.24em;}
.mtn-lbl{font-family:var(--sans);font-size:10px;fill:#7e8f93;text-anchor:middle;letter-spacing:.14em;}
.river-lbl{font-family:var(--sans);font-size:9.5px;fill:#7fa3ab;text-anchor:middle;letter-spacing:.08em;}
.ref-dot{fill:#a9a396;}
.ref-lbl{font-family:var(--sans);font-size:10px;fill:#8a8578;text-anchor:end;letter-spacing:.04em;}
.rail{fill:none;stroke:var(--clay);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.rail-shadow{fill:none;stroke:var(--paper);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
.mtn{fill:none;stroke:var(--deep);stroke-width:1.1;opacity:.3;stroke-linecap:round;}
.ghost-lbl{font-family:var(--sans);font-size:11px;fill:var(--mut);opacity:.75;text-anchor:middle;letter-spacing:.08em;}
.bay-lbl{font-family:var(--sans);font-size:10.5px;fill:#5d7b80;text-anchor:middle;letter-spacing:.1em;}
.wp-dot{fill:var(--paper);stroke:var(--clay);stroke-width:1.8;}
.wp-lbl{font-family:var(--sans);font-size:9.5px;fill:var(--clay);text-anchor:middle;letter-spacing:.04em;}
.pin-hit{cursor:pointer;}
.pin-ring{fill:none;stroke:var(--clay);stroke-width:1.4;opacity:0;}
.pin-ring.on{opacity:.55;}
.pin-dot{fill:var(--deep);transition:r .2s;}
.pin-hit:active .pin-dot{r:8.5;}
.pin-dot.on{fill:var(--clay);}
.pin-lbl-bg{fill:var(--paper);stroke:var(--line);stroke-width:1;}
.pin-lbl-bg.on{stroke:var(--clay);}
.pin-lbl{font-family:var(--serif);font-size:12.5px;font-weight:600;fill:var(--deep);text-anchor:middle;}
.pin-sub{font-family:var(--lat);font-size:9px;fill:var(--gold);text-anchor:middle;letter-spacing:.06em;}
.compass{fill:none;stroke:var(--mut);stroke-width:1;opacity:.55;}
.compass-t{font-family:var(--lat);font-size:11px;fill:var(--mut);text-anchor:middle;opacity:.75;}
.map-cap{
  font-size:10.5px;color:var(--mut);text-align:center;padding:4px 0 2px;letter-spacing:.06em;
}

/* ---------- DAY STRIP ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none;}
.strip::-webkit-scrollbar{display:none;}
.chip-day{
  flex:none;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:16px;padding:10px 14px;
  box-shadow:0 3px 10px rgba(13,51,72,.07);text-align:center;min-width:74px;
  border:1.5px solid var(--glass-b);transition:.16s;
}
.chip-day:active{transform:scale(.96);}
.chip-day.on{border-color:var(--gold);background:#fff;}
.chip-day .n{font-family:var(--lat);font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.04em;}
.chip-day .c{font-family:var(--serif);font-size:13.5px;font-weight:600;color:var(--deep);margin-top:2px;}
.chip-day .dt{font-size:10px;color:var(--mut);margin-top:1px;}

/* ---------- STAT CARDS ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
.stat{
  position:relative;overflow:hidden;
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--glass-b);
  border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 3px 10px rgba(13,51,72,.06);
}
.stat .t{position:relative;z-index:1;font-size:11px;color:var(--mut);letter-spacing:.04em;}
.stat .v{position:relative;z-index:1;font-family:var(--lat);font-size:23px;font-weight:600;color:var(--deep);margin:5px 0 3px;letter-spacing:.01em;}
.stat .v.sm{font-family:var(--serif);font-size:16px;font-weight:700;}
.stat .f{position:relative;z-index:1;font-size:10px;color:var(--mut);}

/* ---------- SECTION ---------- */
.sec-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px;}
.sec-h .num{font-family:var(--lat);font-size:13px;color:var(--gold);letter-spacing:.1em;}
.sec-h h2{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--deep);margin:0;}
.sec-h .act{margin-left:auto;font-size:12px;color:var(--clay);}

/* ---------- DAY HEADER ---------- */
.dayhead{padding:78px 0 4px;}
.dayhead .kick{font-family:var(--lat);font-size:14px;color:var(--gold);letter-spacing:.14em;}
.dayhead h1{font-family:var(--serif);font-size:29px;font-weight:700;color:var(--deep);margin:4px 0 6px;}
.dayhead .meta{font-size:12.5px;color:var(--mut);}
.dayhead .meta b{color:var(--clay);font-weight:500;}

/* ---------- TIMELINE ---------- */
.tl{position:relative;margin-top:22px;padding-left:26px;}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:14px;width:1.5px;background:var(--gold);opacity:.35;}
.ev{position:relative;margin-bottom:6px;padding:12px 46px 12px 12px;border-radius:14px;transition:background .16s;}
.ev:active{background:rgba(255,253,248,.9);}
.ev::before{
  content:"";position:absolute;left:-26px;top:20px;width:11px;height:11px;border-radius:50%;
  background:var(--deep);border:2.5px solid var(--cream);
}
.ev .row1{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px;}
.ev .time{font-family:var(--lat);font-size:19px;font-weight:600;color:var(--gold);letter-spacing:.03em;line-height:1;}
.tag{font-size:10.5px;padding:3px 9px;border-radius:20px;letter-spacing:.03em;white-space:nowrap;}
.tag.交通{background:#dce9ec;color:#155a68;}
.tag.住宿{background:#e0e8dd;color:#4a6146;}
.tag.景點{background:#f0e6d0;color:#8a6b26;}
.tag.飲食{background:#f6e2dc;color:#a44a2c;}
.tag.購物{background:#e6e0ee;color:#5b4b78;}
.tag.其他{background:#e6e3dc;color:#6d675c;}
.badge-bk{font-size:10.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--gold-l);color:var(--gold);}
.ev .ttl{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--deep);line-height:1.4;}
.ev .loc{font-size:12px;color:var(--mut);margin-top:3px;}
.ev .note{
  font-size:12.5px;color:#5c5951;margin-top:7px;padding-left:10px;
  border-left:2px solid var(--line);white-space:pre-wrap;line-height:1.72;
}
.ev .cost{font-family:var(--lat);font-size:14px;color:var(--clay);margin-top:6px;font-weight:600;}
.ev .arrow{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:50%;background:rgba(18,59,69,.06);
  display:flex;align-items:center;justify-content:center;color:var(--deep);font-size:15px;
}
.ev.leg{padding:6px 12px 6px 12px;margin:0 0 6px;}
.ev.leg::before{width:7px;height:7px;left:-24px;top:15px;background:var(--gold);}
.ev.leg .ttl{font-size:13.5px;font-weight:500;color:#4b5a5e;font-family:var(--sans);}

.empty{
  text-align:center;padding:44px 20px;color:var(--mut);font-size:13.5px;
  background:var(--paper);border-radius:18px;margin-top:18px;
}
.empty b{display:block;font-family:var(--serif);font-size:16px;color:var(--deep);margin-bottom:6px;font-weight:600;}

.addbtn{
  width:100%;margin-top:14px;padding:14px;border-radius:14px;
  border:1.5px dashed var(--gold-l);color:var(--gold);
  font-size:13.5px;letter-spacing:.05em;background:rgba(255,253,248,.6);
}
.addbtn:active{background:var(--paper);}

/* ---------- LIST ROWS (expense / todo) ---------- */
.rowcard{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:18px;box-shadow:0 3px 10px rgba(13,51,72,.06);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row .g{flex:1;min-width:0;}
.row .g b{font-family:var(--serif);font-size:14.5px;color:var(--deep);font-weight:600;display:block;}
.row .g small{font-size:11.5px;color:var(--mut);}
.row .amt{font-family:var(--lat);font-size:16px;font-weight:600;color:var(--deep);white-space:nowrap;}
.row .del{color:#c0392b;font-size:17px;padding:4px 6px;opacity:.55;}
.tot{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--deep);color:var(--paper);border-radius:16px;padding:16px 18px;margin-top:12px;
}
.tot span{font-size:13px;letter-spacing:.04em;}
.tot b{font-family:var(--lat);font-size:23px;font-weight:600;}

.check{
  width:22px;height:22px;flex:none;border-radius:6px;border:1.6px solid var(--gold-l);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;
}
.check.on{background:var(--gold);border-color:var(--gold);}
.row.done .g b{text-decoration:line-through;color:var(--mut);}

.inline-add{display:flex;gap:8px;margin-top:12px;}
.inline-add input{
  flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);
}
.inline-add input:focus{outline:none;border-color:var(--gold-l);}
.inline-add button{
  padding:0 20px;border-radius:12px;background:var(--deep);color:var(--paper);font-size:14px;
}

.notebox{
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-b);
  border-radius:18px;padding:16px;box-shadow:0 3px 10px rgba(13,51,72,.06);
}
.notebox textarea{
  width:100%;min-height:190px;border:none;background:transparent;resize:vertical;
  font-size:14px;line-height:1.85;color:var(--ink);
}
.notebox textarea:focus{outline:none;}

.infocard{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--glass-b);border-radius:18px;padding:18px;box-shadow:0 3px 10px rgba(13,51,72,.06);margin-bottom:12px;}
.infocard h3{font-family:var(--serif);font-size:15px;color:var(--deep);margin:0 0 10px;font-weight:700;}
.infocard ul{margin:0;padding-left:17px;font-size:13px;line-height:1.95;color:#4f4c45;}
.infocard .kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.infocard .kv:last-child{border-bottom:none;}
.infocard .kv span{color:var(--mut);flex:none;}
.infocard .kv b{font-weight:500;text-align:right;color:var(--deep);}

.ghost{
  width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
  color:var(--deep);font-size:13.5px;background:var(--paper);margin-top:10px;
}
.ghost.danger{color:#c0392b;}

/* ---------- DRAWER ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(13,44,52,.5);opacity:0;pointer-events:none;
  transition:opacity .28s;z-index:80;backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:min(78vw,320px);z-index:90;
  background:var(--cream);transform:translateX(-102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.drawer.on{transform:translateX(0);}
.drawer-h{background:var(--deep);color:var(--paper);padding:52px 22px 24px;}
.drawer-h .lat{font-family:var(--lat);font-style:italic;font-size:27px;font-weight:600;letter-spacing:.02em;}
.drawer-h .tp{font-size:12px;opacity:.72;margin-top:6px;letter-spacing:.04em;}
.drawer-nav{flex:1;overflow-y:auto;padding:16px 14px 30px;}
.dgroup{font-size:10.5px;color:var(--mut);letter-spacing:.16em;padding:16px 10px 8px;}
.ditem{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:11px 12px;border-radius:12px;margin-bottom:2px;transition:.15s;
}
.ditem:active{background:rgba(18,59,69,.06);}
.ditem.on{background:var(--paper);box-shadow:0 2px 8px rgba(18,59,69,.08);}
.ditem .ic{
  width:32px;height:32px;flex:none;border-radius:50%;background:rgba(18,59,69,.07);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--lat);font-size:14px;font-weight:600;color:var(--deep);
}
.ditem.on .ic{background:var(--gold);color:#fff;}
.ditem .lb{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--deep);}
.ditem .sb{font-size:11px;color:var(--mut);margin-top:1px;}

/* ---------- BOTTOM NAV ---------- */
.bnav{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(247,243,234,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;z-index:50;
}
.bnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--mut);font-size:10px;letter-spacing:.04em;
}
.bnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.bnav button.on{color:var(--deep);}
.bnav button.on .pillbg{background:rgba(18,59,69,.08);}
.pillbg{padding:4px 16px;border-radius:14px;display:flex;align-items:center;justify-content:center;}

/* ---------- SHEET ---------- */
.sheet-scrim{
  position:fixed;inset:0;background:rgba(13,44,52,.45);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheet-scrim.on{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:110;
  background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--glass-b);border-bottom:none;
  border-radius:28px 28px 0 0;
  transform:translateY(102%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  max-height:90dvh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.sheet.on{transform:translateY(0);}
.sheet-grip{width:38px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0;flex:none;}
.sheet-body{overflow-y:auto;padding:16px 22px calc(26px + env(safe-area-inset-bottom));}
.sheet-title{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;}
.sheet-title h2{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--deep);margin:0;flex:1;line-height:1.35;}
.icobtn{

function id(){ return Math.random().toString(36).slice(2,10); }

/* ============ CLOUD SYNC (JSONBin) ============ */
// 到 https://jsonbin.io 免費註冊 → 建立一個新的 Bin → 把 Bin ID 與 X-Master-Key 貼在這裡
// 兩人都打開「同一個 JSONBIN_ID／JSONBIN_KEY」設定過的網頁檔案，行程就會同步。
// 若留空，網頁會自動退回「僅存在這台裝置」的模式，其他功能完全不受影響。
const JSONBIN_ID = '6a75e2b9da38895dfec651af';
const JSONBIN_KEY = '$2a$10$qmgmHoqicJZu30qShXO71uctq0PyVM3j9XOJN4cOpf0uCuaFYznf.';
const CLOUD_ON = !!(JSONBIN_ID && JSONBIN_KEY);
const WHOKEY = 'hida2026:who';

let syncState = CLOUD_ON ? 'idle' : 'local';
let _pushTimer = null;
let pendingPush = false;
let pushRetryCount = 0;

function refreshLiveViews(){
  // 同步狀態改變後，如果使用者沒有正在輸入文字，順便刷新畫面讓「備忘」頁等處即時顯示最新狀態
  const ae = document.activeElement;
  const typing = ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA');
  if(!typing) render();
  else updateSyncBadge();
}

let S;
try{
  const raw = localStorage.getItem(KEY);
  S = raw ? JSON.parse(raw) : seed();
}catch(e){ S = seed(); }
if(!S.travelers) S.travelers = ['Caroline','旅伴'];

function save(skipCloud){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(CLOUD_ON && !skipCloud){
    pendingPush = true;
    pushRetryCount = 0;
    syncState = 'pending';
    clearTimeout(_pushTimer);
    _pushTimer = setTimeout(cloudPush, 1000);
    updateSyncBadge();
  }
}

let lastSyncError = '';

async function cloudPull(silent){
  if(!CLOUD_ON) return;
  if(pendingPush){ return; } // 本機還有尚未推送的變更，暫緩抓取雲端資料以免互相覆蓋
  syncState = 'syncing'; updateSyncBadge();
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_ID+'/latest', {
      headers:{ 'X-Master-Key': JSONBIN_KEY }
    });
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error('HTTP '+res.status+(body?('　'+body.slice(0,140)):''));
    }
    const json = await res.json();
    const remote = json.record;
    if(remote && remote.days && !pendingPush){
      S = remote;
      if(!S.travelers) S.travelers = ['Caroline','旅伴'];
      save(true);
      if(!silent) toast('已同步旅伴的更新');
    }
    syncState = 'synced'; lastSyncError = '';
  }catch(e){
    syncState = 'error';
    lastSyncError = (e && e.message) ? e.message : String(e);
    console.error('cloudPull error:', e);
  }
  refreshLiveViews();
}

async function cloudPush(){
  if(!CLOUD_ON) return;
  syncState = 'syncing'; updateSyncBadge();
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_ID, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(S)
    });
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error('HTTP '+res.status+(body?('　'+body.slice(0,140)):''));
    }
    pendingPush = false;
    pushRetryCount = 0;
    syncState = 'synced'; lastSyncError = '';
  }catch(e){
    syncState = 'error';
    lastSyncError = (e && e.message) ? e.message : String(e);
    console.error('cloudPush error:', e);
    // 推送失敗仍保留 pendingPush，避免背景拉取蓋掉這筆還沒送出去的變更
    // 最多自動重試 3 次（間隔拉長），避免持續失敗時無止盡消耗 JSONBin 額度
    clearTimeout(_pushTimer);
    if(pushRetryCount < 3){
      pushRetryCount++;
      _pushTimer = setTimeout(cloudPush, 15000);
    }
  }
  refreshLiveViews();
}

function manualSync(){
  clearTimeout(_pushTimer);
  pushRetryCount = 0;
  if(pendingPush){ cloudPush(); } else { cloudPull(); }
}

function updateSyncBadge(){
  const el = $('#syncBadge'); if(!el) return;
  const map = {
    local:{t:'僅存本機', c:'var(--mut)'},
    idle:{t:'尚未同步', c:'var(--mut)'},
    pending:{t:'待同步…', c:'var(--gold)'},
    syncing:{t:'同步中…', c:'var(--gold)'},
    synced:{t:'已同步', c:'#2d6a4f'},
    error:{t:'同步失敗，點「備忘」查看原因', c:'#c0392b'}
  };
  const s = map[syncState] || map.idle;
  el.textContent = s.t; el.style.color = s.c;
}

/* ---- 裝置身分（誰在用這台裝置，只存在本機，不上傳雲端） ---- */
function whoAmI(){ return localStorage.getItem(WHOKEY); }
function setWhoAmI(idx){ localStorage.setItem(WHOKEY, String(idx)); closeSheet(); render(); }
function otherIdx(){ const i = Number(whoAmI()); return i===0 ? 1 : 0; }
function askWhoAmI(){
  const names = S.travelers;
  let h = '<div class="sheet-title"><h2>這是誰的裝置？</h2></div>'
    + '<div class="hintline">用來分開顯示你和旅伴各自的待買清單，只存在這台裝置上，之後可以在「備忘」頁重新選擇。</div>'
    + '<div class="tagpick" style="gap:10px;margin-top:6px">'
    + names.map((n,i)=>'<button type="button" class="savebtn" style="width:auto;flex:1;margin-top:0;padding:16px 10px" onclick="setWhoAmI('+i+')">'+esc(n)+'</button>').join('')
    + '</div>';
  openSheet(h);
}

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
function esc(t){ return (t||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function gmap(q,url){ return url && url.trim() ? url : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q||''); }
function yen(n){ return '¥' + (n||0).toLocaleString('en-US'); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),1900); }
function dcount(){
  const start = new Date(2026,8,28);
  const now = new Date(); now.setHours(0,0,0,0);
  const d = Math.round((start-now)/86400000);
  return d > 0 ? 'D-'+d : (d === 0 ? 'DAY 1' : 'D+'+(-d));
}
function dayCost(d){ return d.items.reduce((s,i)=>s+(Number(i.cost)||0),0); }
function totalCost(){ return S.days.reduce((s,d)=>s+dayCost(d),0); }

/* ============ NAV ============ */
function go(v, dayIdx){
  S.view = v;
  if(typeof dayIdx === 'number') S.day = dayIdx;
  save(); closeDrawer(); render();
  $('#scroll').scrollTop = 0;
}

function openDrawer(){ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }

function openSheet(html){
  $('#sheetBody').innerHTML = html;
  $('#sheet').classList.add('on'); $('#sheetScrim').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#sheetScrim').classList.remove('on'); }

/* ============ RENDER ============ */
function render(){
  renderDrawer();
  document.querySelectorAll('.bnav button').forEach(b=>{
    const v = b.dataset.nav;
    b.classList.toggle('on', S.view===v || (v==='overview' && S.view==='day'));
  });

  $('#pillD').textContent = dcount();
  if(S.view==='day'){
    $('#pillCity').textContent = S.days[S.day].city;
    $('#pillDates').innerHTML = S.days[S.day].date.replace('/','.') + '<small>（' + S.days[S.day].wd + '）</small>';
  }else{
    $('#pillCity').textContent = '規劃中';
    $('#pillDates').innerHTML = '9.28<small>– 10.05</small>';
  }

  const v = {overview:vOverview, day:vDay, expenses:vExpenses, todo:vTodo, info:vInfo}[S.view] || vOverview;
  $('#scroll').innerHTML = v();
  if(window.lucide) lucide.createIcons();
}

function renderDrawer(){
  let h = '<div class="dgroup">TRIP</div>';
  h += ditem('overview', null, '🗾', '行程總覽', '地圖與統計');
  h += '<div class="dgroup">DAILY</div>';
  S.days.forEach((d,i)=>{
    h += ditem('day', i, i+1, 'Day ' + (i+1) + '　' + d.date, d.city + '（' + d.items.length + ' 項）');
  });
  h += '<div class="dgroup">MORE</div>';
  h += ditem('expenses', null, '¥', '花費紀錄', yen(totalCost()));

function heroGreeting(){
  const hr = new Date().getHours();
  const timeGreet = hr<5?'夜深了':hr<11?'早安':hr<14?'午安':hr<18?'午後好':'晚安';
  const start = new Date(2026,8,28); const now = new Date(); now.setHours(0,0,0,0);
  const diffDays = Math.round((start-now)/86400000);

  if(diffDays > 0){
    return {line1:timeGreet+'，', line2:'還有 '+diffDays+' 天就要出發囉！', sub:'行李都整理好了嗎？'};
  }
  const dayIdx = -diffDays;
  if(dayIdx >= 0 && dayIdx < S.days.length){
    const city = S.days[dayIdx].city;
    return {line1:timeGreet+'，', line2:'此刻人在'+city+'。', sub:'點下方地圖或城市卡片查看今天的行程。'};
  }
  return {line1:'旅途已經結束，', line2:'山線的秋天，這次好好走過了。', sub:'隨時回來翻看這趟旅程的紀錄。'};
}

/* ---- DETAIL SHEET ---- */
function findItem(iid){
  for(let di=0; di<S.days.length; di++){
    const ix = S.days[di].items.findIndex(x=>x.id===iid);
    if(ix>-1) return {di, ix, it:S.days[di].items[ix]};
  }
  return null;
}

function detail(iid){
  const f = findItem(iid); if(!f) return;
  const it = f.it;
  let h = '<div class="sheet-title"><h2>'+esc(it.title)+'</h2>'
    + '<button class="icobtn" onclick="dupItem(\''+iid+'\')">⧉</button>'
    + '<button class="icobtn danger" onclick="delItem(\''+iid+'\')">🗑</button>'
    + '<button class="icobtn" onclick="editor(\''+iid+'\')">✎</button>'
    + '<button class="icobtn" onclick="closeSheet()">✕</button></div>';

  h += '<div style="display:flex;gap:34px">'
    + '<div><div class="fl">TIME</div><div class="fv" style="font-family:var(--lat);font-size:23px">'+esc(it.time||'--:--')+'</div></div>'
    + '<div><div class="fl">TAG</div><span class="tag '+it.tag+'" style="font-size:12px;padding:5px 12px">'+it.tag+'</span></div>'
    + '</div>';

  if(it.tag==='交通' && (it.from||it.to||it.line)){
    h += '<div class="fl">ROUTE</div><div class="fv" style="font-size:15px">'+esc(it.from||'—')+' → '+esc(it.to||'—')+'</div>';
    if(it.line) h += '<div class="loc" style="font-size:12.5px;color:var(--mut);margin-top:4px">'+esc(it.line)+'</div>';
  }

  if(it.loc){ h += '<div class="fl">LOCATION</div><div class="fv" style="font-size:15px">◉ '+esc(it.loc)+'</div>'; }

  h += '<div class="fl">BOOKING &amp; ACTIONS</div><div class="actgrid">'
    + '<div class="confbox"><small>CONFIRMATION</small><b>'+(it.conf?esc(it.conf):'———')+'</b></div>'
    + '<a href="'+gmap(it.loc||it.title, it.url)+'" target="_blank" rel="noopener">◉<br>地圖</a>'
    + (it.url?'<a href="'+esc(it.url)+'" target="_blank" rel="noopener">⊕<br>連結</a>':'<div class="fake">⊕<br>連結</div>')
    + '</div>';

  if(Number(it.cost)){
    h += '<div class="fl">COST</div><div class="fv" style="font-family:var(--lat);font-size:22px;color:var(--clay)">'+yen(it.cost)+'</div>';
  }
  if(it.memo){ h += '<div class="fl">MEMO</div><div class="fv memo">'+esc(it.memo)+'</div>'; }

  h += '<button class="savebtn" style="margin-top:22px" onclick="editor(\''+iid+'\')">編輯這個項目</button>';
  openSheet(h);
}

function dupItem(iid){
  const f = findItem(iid); if(!f) return;
  const c = JSON.parse(JSON.stringify(f.it)); c.id = id(); c.title = f.it.title + '（複製）';
  S.days[f.di].items.splice(f.ix+1, 0, c);
  save(); closeSheet(); render(); toast('已複製項目');
}
function delItem(iid){
  const f = findItem(iid); if(!f) return;
  if(!confirm('確定要刪除「'+f.it.title+'」？')) return;
  S.days[f.di].items.splice(f.ix,1);
  save(); closeSheet(); render(); toast('已刪除');
}

  let h = '<div class="sheet-title"><h2>'+(iid?'編輯項目':'新增行程項目')+'</h2>'

    + '<div class="field"><label>出發 FROM</label><input id="fFrom" value="'+esc(it.from||'')+'" placeholder="高山駅"></div>'
    + '<div class="field"><label>抵達 TO</label><input id="fTo" value="'+esc(it.to||'')+'" placeholder="下呂駅"></div>'
    + '</div>'
    + '<div class="field"><label>路線／班次 LINE</label><input id="fLine" value="'+esc(it.line||'')+'" placeholder="JR 高山本線　特急ひだ5号"></div>'
    + '<div class="hintline">轉乘細節可寫在下方備註，例如「美濃太田轉太多線，月台 3 番線」。</div>'
    + '</div>';

  h += '<div class="f2">'

    + '<div class="field"><label>預訂編號 CONF.</label><input id="fConf" value="'+esc(it.conf)+'" placeholder="選填"></div>'

  openSheet(h);

function pickTag(btn, t){
  window._tag = t;
  btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const lf = $('#legFields'); if(lf) lf.style.display = (t==='交通') ? 'block' : 'none';
}

function saveItem(iid){
  const title = $('#fTitle').value.trim();
  if(!title){ toast('請填寫名稱'); return; }
  const obj = {
    id: iid || id(),
    time: $('#fTime').value,
    tag: window._tag || '景點',
    title,
    loc: $('#fLoc').value.trim(),
    memo: $('#fMemo').value,
    conf: $('#fConf').value.trim(),
    cost: Number($('#fCost').value) || 0,
    url: $('#fUrl').value.trim(),
    from: $('#fFrom') ? $('#fFrom').value.trim() : '',
    to: $('#fTo') ? $('#fTo').value.trim() : '',
    line: $('#fLine') ? $('#fLine').value.trim() : ''
  };
  const targetDay = Number($('#fDay').value);
  if(iid){
    const f = findItem(iid);
    if(f) S.days[f.di].items.splice(f.ix,1);
  }
  S.days[targetDay].items.push(obj);
  S.days[targetDay].items.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  S.day = targetDay; S.view = 'day';
  save(); closeSheet(); render(); toast(iid?'已儲存':'已新增');
}

    + '<div class="meta">'+S.todos.filter(t=>t.done).length+' / '+S.todos.length+' 已完成（全部）</div></div>';

  if(myIdx===null){
    h += '<div class="infocard" style="display:flex;align-items:center;gap:12px;justify-content:space-between">'
      + '<div style="font-size:12.5px;color:var(--mut)">尚未設定「這是誰的裝置」，暫時顯示全部項目</div>'
      + '<button class="ghost" style="width:auto;margin:0;padding:9px 14px;white-space:nowrap" onclick="askWhoAmI()">設定身分</button></div>';
  }

  const oIdx = myIdx===null ? null : (myIdx===0?1:0);
  h += '<div class="tagpick" style="margin-bottom:12px">'
    + '<button type="button" class="'+(todoFilter==='mine'?'on':'')+'" onclick="setTodoFilter(\'mine\')">'+(myIdx!==null?esc(names[myIdx]):'我')+'的</button>'
    + '<button type="button" class="'+(todoFilter==='other'?'on':'')+'" onclick="setTodoFilter(\'other\')">'+(oIdx!==null?esc(names[oIdx]):'旅伴')+'的</button>'
    + '<button type="button" class="'+(todoFilter==='all'?'on':'')+'" onclick="setTodoFilter(\'all\')">全部</button>'
    + '</div>';

  let list = S.todos;
  if(myIdx!==null){
    if(todoFilter==='mine') list = S.todos.filter(t=>t.owner===myIdx || t.owner==null);
    else if(todoFilter==='other') list = S.todos.filter(t=>t.owner===oIdx || t.owner==null);
  }

  h += '<div class="rowcard">';
  h += list.length ? list.map(t=>{
      const ownerLbl = t.owner==null ? '共同' : esc(names[t.owner]||'');
      return '<div class="row'+(t.done?' done':'')+'">'
      + '<button class="check'+(t.done?' on':'')+'" onclick="toggleTodo(\''+t.id+'\')">'+(t.done?'✓':'')+'</button>'
      + '<div class="g"><b>'+esc(t.t)+'</b><small>'+ownerLbl+'</small></div>'
      + '<button class="del" onclick="delTodo(\''+t.id+'\')">✕</button></div>';
    }).join('')
    : '<div class="row"><div class="g"><small>這個分類目前是空的</small></div></div>';
  h += '</div>';
  h += '<div class="inline-add"><input id="todoIn" placeholder="想買的東西⋯" onkeydown="if(event.key===\'Enter\')addTodo()"><button onclick="addTodo()">新增</button></div>';
  h += '<div class="hintline">新增的項目預設歸在「'+(myIdx!==null?esc(names[myIdx]):'尚未設定身分')+'」名下，只有共同項目兩人都會看到。</div>';
  return h;
}
function setTodoFilter(f){ todoFilter = f; render(); }
function addTodo(){
  const v = $('#todoIn').value.trim(); if(!v) return;
  const who = whoAmI();
  S.todos.push({id:id(), t:v, done:false, owner: who!==null ? Number(who) : null});
  save(); render(); toast('已加入清單');
}
function toggleTodo(tid){ const t=S.todos.find(x=>x.id===tid); if(t){t.done=!t.done; save(); render();} }
function delTodo(tid){ S.todos = S.todos.filter(x=>x.id!==tid); save(); render(); }

/* ---- INFO ---- */
function vInfo(){
  const stays = [];
  S.days.forEach((d,i)=>d.items.filter(x=>x.tag==='住宿'&&+x.cost).forEach(x=>stays.push({d,i,x})));

  let h = '<div class="dayhead"><div class="kick">NOTES</div><h1>備忘錄</h1>'
    + '<div class="meta">住宿資訊、提醒事項與資料備份</div></div>';

  h += '<div class="sec-h"><span class="num">01</span><h2>住宿一覽</h2></div>';
  stays.forEach(s=>{
    h += '<div class="infocard"><h3>'+esc(s.x.title)+'</h3>'
      + '<div class="kv"><span>日期</span><b>Day '+(s.i+1)+'　'+s.d.date+' 起</b></div>'
      + '<div class="kv"><span>費用</span><b>'+yen(s.x.cost)+'</b></div>'
      + (s.x.conf?'<div class="kv"><span>訂房編號</span><b>'+esc(s.x.conf)+'</b></div>':'')
      + '<button class="ghost" onclick="detail(\''+s.x.id+'\')">查看詳細資訊</button></div>';
  });

  h += '<div class="sec-h"><span class="num">02</span><h2>共同編輯</h2></div>'
    + '<div class="infocard">'
    + '<div class="kv"><span>雲端同步</span><b>'+(CLOUD_ON?'已啟用':'尚未設定')+'</b></div>'
    + '<div class="kv"><span>目前狀態</span><b>'+({local:'僅存本機',idle:'尚未同步',pending:'待同步…',syncing:'同步中…',synced:'已同步',error:'同步失敗'}[syncState]||syncState)+'</b></div>'
    + '<div class="kv"><span>這台裝置是</span><b>'+(whoAmI()!==null?esc(S.travelers[Number(whoAmI())]):'尚未設定')+'</b></div>'
    + (CLOUD_ON && syncState==='error' ? '<div class="hintline" style="color:#c0392b">失敗原因：'+esc(lastSyncError||'未知錯誤')+'</div>' : '')
    + (CLOUD_ON?'<button class="ghost" onclick="manualSync()">立即同步</button>':'<div class="hintline" style="margin-top:6px">目前僅存在這台裝置。要跟旅伴共同編輯行程，需要先設定 JSONBin 雲端同步（程式碼開頭 JSONBIN_ID／JSONBIN_KEY）。</div>')
    + '<button class="ghost" onclick="askWhoAmI()">重新設定「這是誰的裝置」</button>'
    + '<div class="field" style="margin-top:14px"><label>旅伴名稱 1</label><input value="'+esc(S.travelers[0])+'" onchange="S.travelers[0]=this.value;save();render()"></div>'
    + '<div class="field" style="margin-bottom:0"><label>旅伴名稱 2</label><input value="'+esc(S.travelers[1])+'" onchange="S.travelers[1]=this.value;save();render()"></div>'
    + '</div>';

  h += '<div class="sec-h"><span class="num">03</span><h2>自由備註</h2></div>'
    + '<div class="notebox"><textarea id="noteArea" oninput="S.notes=this.value;save()" placeholder="隨手記下任何事⋯">'+esc(S.notes)+'</textarea></div>';

  h += '<div class="sec-h"><span class="num">04</span><h2>資料</h2></div>'
    + '<div class="infocard"><ul style="font-size:12.5px">'
    + (CLOUD_ON
        ? '<li>行程與待買清單會同步到雲端，兩人共用同一份資料</li><li>待買清單可依身分分開顯示，仍建議定期匯出備份</li>'
        : '<li>資料儲存在這台裝置的瀏覽器中，換裝置或清除瀏覽資料會消失</li><li>建議定期匯出備份，或匯入到另一台裝置</li>')
    + '</ul>'
    + '<button class="ghost" onclick="exportData()">匯出備份檔（JSON）</button>'
    + '<button class="ghost" onclick="importData()">從備份檔匯入</button>'
    + '<button class="ghost danger" onclick="resetAll()">重設為預設行程</button></div>';
  return h;
}

function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hida-nagoya-trip-backup.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('已匯出備份檔');
}
function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if(!o.days) throw 0;
        S = o; save(); render(); toast('匯入完成');
      }catch(err){ toast('檔案格式不正確'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  if(!confirm('這會清除所有自訂內容，回到預設行程。確定嗎？')) return;
  S = seed(); save(); render(); toast('已重設');
}

/* ============ INIT ============ */
render();
updateSyncBadge();
window.addEventListener('DOMContentLoaded', function(){ if(window.lucide) lucide.createIcons(); });
window.addEventListener('load', function(){ if(window.lucide) lucide.createIcons(); });

if(CLOUD_ON){
  cloudPull(true);
  setInterval(function(){ cloudPull(true); }, 45000);
  window.addEventListener('focus', function(){ cloudPull(true); });
}
if(whoAmI()===null){
  setTimeout(function(){ askWhoAmI(); }, CLOUD_ON ? 900 : 300);
}

</script>
</body>
</html>
